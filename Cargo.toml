[package]
name = "pesu-wifi"
version = "3.4.0"
edition = "2021"
authors = ["imyash0722"]
description = "High-performance native Rust captive portal login manager and keepalive watchdog for PES University"
license = "MIT"

[dependencies]
ureq = "2.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
chrono = "0.4"
fs2 = "0.4"
rpassword = "7.3"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_WiFi",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
