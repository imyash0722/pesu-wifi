[package]
name = "pesu-wifi"
version = "3.0.0"
edition = "2021"
authors = ["imyash0722"]
description = "High-performance native Rust captive portal login manager and keepalive watchdog for PES University"
license = "MIT"

[dependencies]
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.36"
chrono = "0.4"
fs2 = "0.4"
rpassword = "7.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
